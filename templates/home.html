<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puissance 4</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style/style.css">
</head>
<body>

<!-- Animated background elements -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<!-- Floating Chips -->
<div class="floating-chip c-red chip-1"></div>
<div class="floating-chip c-yellow chip-2"></div>
<div class="floating-chip c-red chip-3"></div>
<div class="floating-chip c-yellow chip-4"></div>
<div class="floating-chip c-red chip-5"></div>
<div class="floating-chip c-yellow chip-6"></div>

<div class="home-container">
  <div class="home-card">
    <h1>Puissance 4</h1>
    <p>Re-découvrez le jeu classique dans un univers doux, vibrant et pastel.</p>
    <form action="/start" method="POST" class="name-form">
      <input type="text" name="p1" placeholder="Prénom Joueur 1 (Rouge)" required class="name-input p1-input">
      <input type="text" name="p2" placeholder="Prénom Joueur 2 (Jaune)" required class="name-input p2-input">
      <button type="submit" class="play-button">Lancer une partie</button>
    </form>
  </div>
</div>

</body>
</html>
